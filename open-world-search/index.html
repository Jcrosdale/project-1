<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open World Search</title>

    <!-- Link CSS and JS-->
    <link src="style.css" href="stylesheet">
    <script src="script.js"></script>

</head>
<body>
    <header>
        <h2>Where in the world?</h2>
        <div id="light-mode">
            <image href="" alt="Light mode"></image>
            <span>Light Mode</span>
        </div>
        <div id="dark-mode">
            <image href="" alt="Dark mode"></image>
            <span>Dark Mode</span>
        </div>
    </header>
    <body>
        <input type="search" id="site-search" placeholder="Search for a country..."/>

        <select name="filter" id="filter-region">
            <option value=""> Filter by Region </option>
            <option value="Africa">Africa</option>
            <option value="America">America</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
        </select>

    </body>
</body>
</html>
