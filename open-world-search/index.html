<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open World Search</title>

    <!-- Link CSS and JS-->
    <link href="style.css" rel="stylesheet" />
    <script type="module" src="script.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Rouge+Script&display=swap"
        rel="stylesheet">

</head>

<body>

    <header>
        <h1>Where in the world?</h1>

        <button id="theme-switch" type="button">
            Dark Mode
        </button>

    </header>

    <main>
        <section id="search-section">
            <input 
                type="search" 
                id="site-search" 
                placeholder="Search for a country..." 
                aria-label="Search for a country"
            >

            <select 
                name="filter" 
                id="filter-region" 
                aria-label="Filter countries by region"
            >
                <option value="" selected disabled> Filter by Region </option>
                <option value="Africa">Africa</option>
                <option value="America">America</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="Oceania">Oceania</option>
            </select>
        </section>

        <section id="country-list" aria-label="Countries">

        </section>

    </main>

</body>

</html>
